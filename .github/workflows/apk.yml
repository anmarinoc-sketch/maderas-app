name: Compilar APK

on:
  # Sin filtro de rutas en push: al etiquetar una version, GitHub evalua `paths`
  # de forma poco fiable y el release podria no llegar a publicarse nunca.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL pública del backend (ej. https://madera-backend-xxx.run.app). Vacío = usa la variable BASE_URL del repositorio.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    name: APK de debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      # El repositorio no incluye gradle-wrapper.jar (es un binario), asi que la CI usa
      # una distribucion de Gradle propia. Android Studio genera el wrapper al abrir el
      # proyecto, para quien compile en local.
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          build-root-directory: android

      # Sin clave estable, cada compilacion firma con una distinta y Android no deja
      # actualizar sobre lo ya instalado. El secreto es opcional: si no esta, se compila
      # igual con la clave que genera Gradle.
      - name: Restaurar la clave de firma
        env:
          CLAVE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLAVE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$CLAVE_B64" | base64 -d > keystore/xiloscan.p12
            echo "Clave de firma estable restaurada ($(wc -c < keystore/xiloscan.p12) bytes)."
          else
            echo "Sin DEBUG_KEYSTORE_B64: se firmara con la clave que genere Gradle."
            echo "Habra que desinstalar la version anterior para poder instalar esta."
          fi

      - name: Compilar APK
        env:
          # Se inyecta en BuildConfig.BASE_URL al compilar. El usuario puede cambiarla
          # despues desde los ajustes de la app sin recompilar.
          BASE_URL: ${{ github.event.inputs.base_url || vars.BASE_URL }}
          # Secreto compartido con el backend. Vacio si no esta configurado.
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # La huella permite comprobar que todas las compilaciones firman con la MISMA
      # clave. Si cambia entre una version y otra, Android rechazara la actualizacion.
      - name: Mostrar la huella de firma
        run: |
          FIRMADOR=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$FIRMADOR" ]; then
            echo "No se encontro apksigner; se omite la comprobacion."
            exit 0
          fi
          HUELLA=$("$FIRMADOR" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                   | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "Huella SHA-256 de la firma: $HUELLA"
          echo "### Firma del APK" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$HUELLA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Clave estable esperada: \`498db233e7e1278ef52c34e4d371f57e0f89a8d30dfb65dd2e994b521b86d7eb\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Renombrar el APK con el commit
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk \
             "entrega/xiloscan-${GITHUB_SHA::7}.apk"

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: xiloscan-apk
          path: android/entrega/*.apk
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Recuperar el APK compilado
        uses: actions/download-artifact@v4
        with:
          name: xiloscan-apk
          path: entrega

      # Un release da una URL estable que se puede abrir desde el navegador del movil
      # para instalar el APK directamente, sin pasar por el PC.
      - name: Crear el release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" entrega/*.apk \
            --title "XiloScan $GITHUB_REF_NAME" \
            --notes "APK de debug. Descárgalo desde el móvil y permite la instalación de orígenes desconocidos."
